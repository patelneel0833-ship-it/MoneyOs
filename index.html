 <label>${ty=='income'?'Source / from':ty=='transfer'?'To / from account':'Merchant'}</label><input id="fm" list="ml" value="${esc(e.merchant)}"><datalist id="ml">${[...new Set(tx.map(t=>t.merchant).filter(Boolean))].slice(0,30).map(m=>`<option value="${esc(m)}">`).join('')}</datalist>
 <label>Payment method</label><select id="fpm" style="width:100%">${PAY.map(p=>`<option ${e.pay==p?'selected':''}>${p}</option>`).join('')}</select>
 <label>${ty=='transfer'?'From account':'Account'}</label><select id="fac" style="width:100%">${acs.filter(a=>a.active!==false).map(a=>`<option value="${a.id}" ${A(e)==a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>${ty=='transfer'?`<label>To account</label><select id="fto" style="width:100%">${acs.filter(a=>a.active!==false).map(a=>`<option value="${a.id}" ${e.to==a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`:''}<div class="two"><div><label>Date</label><input id="fd" type="date" value="${e.date}"></div><div><label>Time</label><input id="ft" type="time" value="${e.time||''}"></div></div>
 <label>Notes</label><textarea id="fn" rows="2">${esc(e.notes)}</textarea><p id="er" class="dn d"></p>
 <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn p" id="sv" style="flex:1">Save</button>${id?'<button class="btn" id="du">Duplicate</button><button class="btn r" id="de">Delete</button>':''}<button class="btn" id="cn">Cancel</button></div>`;
 d.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{e.amount=Math.round((parseFloat($('#fa').value)||0)*100);e.merchant=$('#fm').value;e.acc=$('#fac').value;ty=b.dataset.t;if(ty=='income')e.category='Allowance';else if(ty=='expense')e.category='Food & beverages';draw()});
 $('#cn').onclick=()=>d.close();
 $('#sv').onclick=async()=>{const a=Math.round((parseFloat($('#fa').value)||0)*100);if(a<=0||!$('#fd').value){$('#er').textContent='Enter an amount above zero and a date.';return}if(ty=='transfer'&&$('#fac').value==$('#fto').value){$('#er').textContent='Choose two different accounts.';return}
  const t={id:id||Date.now().toString(36)+Math.random().toString(36).slice(2,6),type:ty,amount:a,category:ty=='transfer'?'':$('#fcat').value,merchant:$('#fm').value.trim(),pay:$('#fpm').value,date:$('#fd').value,time:$('#ft').value,notes:$('#fn').value.trim(),acc:$('#fac').value,to:ty=='transfer'?$('#fto').value:undefined};
  await saveTx(t);const i=tx.findIndex(x=>x.id==t.id);i>=0?tx[i]=t:tx.push(t);meta.pay=t.pay;saveMeta();d.close();render();toast(id?'Updated ✓':'Saved ✓')};
 if(id){$('#de').onclick=async()=>{if(confirm('Delete this transaction?')){await delTx(id);tx=tx.filter(t=>t.id!=id);d.close();render();toast('Deleted')}};
  $('#du').onclick=async()=>{const t={...e,id:Date.now().toString(36)+'d',date:today()};await saveTx(t);tx.push(t);d.close();render()}}};
 draw();d.showModal();if(!id)setTimeout(()=>$('#fa')?.focus(),50)}
$('#fab').onclick=()=>form();
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')||e.metaKey||e.ctrlKey)return;if(e.key=='n'&&!$('#dlg').open){e.preventDefault();form()}});
(async()=>{try{db=await open();tx=await rq(st('tx').getAll());acs=await rq(st('acc').getAll());if(!acs.find(a=>a.id=='legacy')){const l={id:'legacy',name:'Main account (existing data)',type:'Savings bank account',opening:0,active:true};await rq(st('acc','readwrite').put(l));acs.unshift(l)}meta={...meta,...(await rq(st('meta').get('s'))||{})}}catch(e){console.error(e)}applyCats();theme();render()})();
</script></body></html>
